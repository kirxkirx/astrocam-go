name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build Linux binary
        run: |
          # No cgo: the program then needs no C library of a particular version and
          # runs on old Linux systems as well as on new ones.
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o astrocam-go
          chmod +x astrocam-go

      - name: Build Windows 64-bit binary
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o astrocam-go-win64.exe

      - name: Build Windows 32-bit binary
        run: |
          GOOS=windows GOARCH=386 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o astrocam-go-win32.exe

      - name: Create checksums
        run: |
          sha256sum astrocam-go > checksums.txt
          sha256sum astrocam-go-win64.exe >> checksums.txt
          sha256sum astrocam-go-win32.exe >> checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Create release archive
        run: |
          # Create a release package with all necessary files
          mkdir -p astrocam-${{ steps.version.outputs.version }}
          
          # Copy binaries
          cp astrocam-go astrocam-${{ steps.version.outputs.version }}/
          cp astrocam-go-win64.exe astrocam-${{ steps.version.outputs.version }}/
          cp astrocam-go-win32.exe astrocam-${{ steps.version.outputs.version }}/
          
          # Copy configuration and documentation
          cp config.env.example astrocam-${{ steps.version.outputs.version }}/
          cp areas.txt astrocam-${{ steps.version.outputs.version }}/
          cp README.md astrocam-${{ steps.version.outputs.version }}/
          cp checksums.txt astrocam-${{ steps.version.outputs.version }}/
          
          # Create installation scripts
          cat > astrocam-${{ steps.version.outputs.version }}/install-linux.sh << 'EOF'
          #!/bin/bash
          # Installs astrocam-go into /opt/astrocam, or upgrades the program there.
          # An existing config.env and areas.txt are kept.
          set -e
          cd "$(dirname "$0")"

          case "$(uname -m)" in
            x86_64) ;;
            *) echo "This package holds astrocam-go for 64-bit PCs (x86-64) only; this computer is $(uname -m)." >&2
               exit 1 ;;
          esac
          echo "Installing AstroCam for Linux..."

          # The program keeps its temp folder and lock file next to itself, so the
          # folder belongs to the user who runs it, not to root. An upgrade keeps the
          # owner the folder already has, unless that is root (older install scripts
          # left everything to root).
          OWNER="${SUDO_USER:-$(id -un)}"
          if sudo test -d /opt/astrocam/ && [ "$(sudo stat -c %u /opt/astrocam/)" != 0 ]; then
            OWNER="$(sudo stat -c %U /opt/astrocam/)"
          fi
          sudo mkdir -p /opt/astrocam

          # The new program goes in under a new name and then takes the place of the
          # old one, which works even while the old one is still running.
          sudo cp astrocam-go /opt/astrocam/astrocam.new
          sudo chmod 755 /opt/astrocam/astrocam.new
          sudo mv -f /opt/astrocam/astrocam.new /opt/astrocam/astrocam
          echo "Installed the program: /opt/astrocam/astrocam"

          if sudo test -e /opt/astrocam/config.env; then
            echo "Kept the existing /opt/astrocam/config.env"
          else
            sudo cp config.env.example /opt/astrocam/config.env
            echo "Installed the example config.env - fill it in"
          fi
          if sudo test -e /opt/astrocam/areas.txt; then
            echo "Kept the existing /opt/astrocam/areas.txt"
          else
            sudo cp areas.txt /opt/astrocam/areas.txt
            echo "Installed the example areas.txt - replace it with your field names"
          fi
          sudo cp README.md /opt/astrocam/README.md
          sudo chown -R "$OWNER": /opt/astrocam/

          echo ""
          echo "AstroCam is installed in /opt/astrocam."
          echo ""
          echo "Next steps for a first installation:"
          echo "1. Fill in config.env - upload address, login, camera tag (SAI_POSTFIX),"
          echo "   images per visit (SAI_COUNT) and folders: nano /opt/astrocam/config.env"
          echo "2. Put your field names into: nano /opt/astrocam/areas.txt"
          echo "3. Make the camera software name the images as README.md says."
          echo "4. Start it as $OWNER: cd /opt/astrocam && ./astrocam"
          echo ""
          echo "After an upgrade, stop the running astrocam with Ctrl+C and start it again."
          EOF

          cat > astrocam-${{ steps.version.outputs.version }}/install-windows.bat << 'EOF'
          @echo off
          rem Installs astrocam-go into C:\AstroCam, or upgrades the program there.
          rem An existing config.env and areas.txt are kept.
          rem The package files are taken from the folder of this script, whatever folder
          rem Windows starts it in ("Run as administrator" starts it in System32).
          pushd "%~dp0" || goto nofiles
          echo Installing AstroCam for Windows...
          echo.

          rem The 32-bit program on 32-bit Windows and on Windows on ARM (which runs
          rem 32-bit programs for x86 everywhere), the 64-bit one everywhere else.
          set "EXE=astrocam-go-win64.exe"
          if /i "%PROCESSOR_ARCHITECTURE%"=="x86" if not defined PROCESSOR_ARCHITEW6432 set "EXE=astrocam-go-win32.exe"
          if /i "%PROCESSOR_ARCHITECTURE%"=="ARM64" set "EXE=astrocam-go-win32.exe"
          if /i "%PROCESSOR_ARCHITEW6432%"=="ARM64" set "EXE=astrocam-go-win32.exe"
          if not exist "%EXE%" goto nofiles
          if not exist "config.env.example" goto nofiles
          if not exist "areas.txt" goto nofiles

          if not exist "C:\AstroCam\" (
              mkdir "C:\AstroCam" || goto failed
          )
          copy /y "%EXE%" "C:\AstroCam\astrocam.exe" >nul || goto failed
          echo Installed the program: C:\AstroCam\astrocam.exe

          if exist "C:\AstroCam\config.env" (
              echo Kept the existing C:\AstroCam\config.env
          ) else (
              copy "config.env.example" "C:\AstroCam\config.env" >nul || goto failed
              echo Installed the example config.env - fill it in
          )
          if exist "C:\AstroCam\areas.txt" (
              echo Kept the existing C:\AstroCam\areas.txt
          ) else (
              copy "areas.txt" "C:\AstroCam\areas.txt" >nul || goto failed
              echo Installed the example areas.txt - replace it with your field names
          )
          copy /y "README.md" "C:\AstroCam\README.md" >nul

          echo.
          echo AstroCam is installed in C:\AstroCam
          echo.
          echo Next steps for a first installation:
          echo 1. Fill in config.env - upload address, login, camera tag (SAI_POSTFIX),
          echo    images per visit (SAI_COUNT) and folders: notepad C:\AstroCam\config.env
          echo 2. Put your field names into: notepad C:\AstroCam\areas.txt
          echo 3. Make NINA name the images as README.md says (section NINA).
          echo 4. Start it: C:\AstroCam\astrocam.exe
          echo.
          echo After an upgrade, start C:\AstroCam\astrocam.exe again.
          echo.
          popd
          pause
          exit /b 0

          :failed
          echo.
          echo INSTALLATION FAILED: a file could not be copied (see the message above).
          echo If astrocam.exe is running, stop it with Ctrl+C and run this script again.
          echo.
          popd
          pause
          exit /b 1

          :nofiles
          echo.
          echo INSTALLATION FAILED: the files of the package are not next to this script.
          echo Unpack the whole zip file into a folder (Extract all) and run
          echo install-windows.bat from that folder.
          echo.
          pause
          exit /b 1
          EOF
          # cmd.exe needs Windows line endings to find the labels of a batch file.
          sed -i 's/$/\r/' astrocam-${{ steps.version.outputs.version }}/install-windows.bat

          chmod +x astrocam-${{ steps.version.outputs.version }}/install-linux.sh
          
          # Create complete release archive
          tar -czf astrocam-${{ steps.version.outputs.version }}-complete.tar.gz astrocam-${{ steps.version.outputs.version }}/
          zip -r astrocam-${{ steps.version.outputs.version }}-complete.zip astrocam-${{ steps.version.outputs.version }}/

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << EOF
          # AstroCam ${{ steps.version.outputs.version }}

          astrocam-go runs on the computer that controls a telescope camera. It packs the images of each visit to a sky field into one archive and uploads it to the transient search of the New Milky Way (NMW) survey while the night is still going on. The [README](https://github.com/${{ github.repository }}#readme) explains what it does, how to set it up and what its console messages mean.

          ## Which file to download

          - \`astrocam-go-win64.exe\` - Windows 10 or newer, 64-bit
          - \`astrocam-go-win32.exe\` - Windows 10 or newer, 32-bit, and Windows on ARM
          - \`astrocam-go\` - Linux on a 64-bit PC (x86-64)
          - \`astrocam-${{ steps.version.outputs.version }}-complete.zip\` or \`.tar.gz\` - all three programs, together with \`config.env.example\`, \`areas.txt\`, \`README.md\` and install scripts

          ## Upgrading

          1. Stop astrocam-go with Ctrl+C in its window.
          2. Replace the program file with the new one, under the name the computer starts it by. If it was installed with an install script, run the install script of the new release instead: it replaces the program and keeps \`config.env\` and \`areas.txt\`.
          3. Start it again. It prints \`Version: ${{ steps.version.outputs.version }}\` at startup.

          Keep \`config.env\`, \`areas.txt\` and the \`temp\` folder: \`temp\` may hold archives that have not been uploaded yet, and they are sent after the restart.

          ## First installation

          Put the program, a \`config.env\` made from \`config.env.example\`, and an \`areas.txt\` with your field names into one folder that the user running the program can write to, for example \`C:\\AstroCam\`, and start the program. On Linux, make the program executable first: \`chmod +x astrocam-go\`. Or unpack a complete package and run \`install-windows.bat\` (double-click it) or \`./install-linux.sh\` (it asks for the sudo password): they copy the program and the example \`config.env\` and \`areas.txt\` into \`C:\\AstroCam\` or \`/opt/astrocam\`, keeping these two files if they are there already. Then fill in both files and start the program. The README says what goes into \`config.env\` and \`areas.txt\`, what to ask the server administrator for, and how NINA has to name the images.

          ## Changes

          The commits up to this release: https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.version }}

          ## Checking the download

          \`checksums.txt\` holds the SHA-256 checksums of the three programs. On Linux:

          \`\`\`
          sha256sum --ignore-missing -c checksums.txt
          \`\`\`

          On Windows, compare the output of \`certutil -hashfile astrocam-go-win64.exe SHA256\` with the line for that file in \`checksums.txt\`.

          ## Problems

          Faults in astrocam-go itself: https://github.com/${{ github.repository }}/issues
          EOF
          
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: AstroCam ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.release_notes }}
          draft: false
          prerelease: false

      - name: Upload Linux binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./astrocam-go
          asset_name: astrocam-go
          asset_content_type: application/octet-stream

      - name: Upload Windows 64-bit binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./astrocam-go-win64.exe
          asset_name: astrocam-go-win64.exe
          asset_content_type: application/octet-stream

      - name: Upload Windows 32-bit binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./astrocam-go-win32.exe
          asset_name: astrocam-go-win32.exe
          asset_content_type: application/octet-stream

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./checksums.txt
          asset_name: checksums.txt
          asset_content_type: text/plain

      - name: Upload complete package (tar.gz)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./astrocam-${{ steps.version.outputs.version }}-complete.tar.gz
          asset_name: astrocam-${{ steps.version.outputs.version }}-complete.tar.gz
          asset_content_type: application/gzip

      - name: Upload complete package (zip)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./astrocam-${{ steps.version.outputs.version }}-complete.zip
          asset_name: astrocam-${{ steps.version.outputs.version }}-complete.zip
          asset_content_type: application/zip
